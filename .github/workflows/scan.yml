name: daily-scan

# 每个交易日 15:50（北京时间）自动扫全市场
# 4 分片并行（每个 runner 换 IP，避免单 IP 限流），最后一个 job 合并提交
on:
  schedule:
    - cron: '50 7 * * 1-5'   # UTC 07:50 = 北京 15:50
  workflow_dispatch:
    inputs:
      limit:
        description: '扫描数量（测试填 500，全市场填 5000）'
        default: '5000'

concurrency:
  group: daily-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      TZ: Asia/Shanghai
      SHARDS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Scan shard ${{ matrix.shard }}
        timeout-minutes: 105
        env:
          NO_PROXY: '*'
        run: |
          python scan_market.py \
            --top "${{ github.event.inputs.limit || '5000' }}" \
            --shard "${{ matrix.shard }}/4" \
            --workers 2 \
            --deadline-min 95 \
            --out "out/part-${{ matrix.shard }}.json" \
            --limit 0

      - name: Upload shard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.shard }}
          path: out/part-${{ matrix.shard }}.json
          retention-days: 2
          if-no-files-found: ignore

  publish:
    needs: scan
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Download shards
        uses: actions/download-artifact@v4
        with:
          pattern: part-*
          path: out
          merge-multiple: true

      - name: Merge shards
        run: |
          ls -la out/ || true
          python scan_market.py --merge "out/part-*.json" --out out/daily_signals.json

      - name: Show health
        run: |
          python - <<'PY'
          import json, pathlib, datetime
          p = pathlib.Path('out/daily_signals.json')
          if not p.exists():
              raise SystemExit('没有产出 daily_signals.json，本次不提交')
          d = json.loads(p.read_text(encoding='utf-8'))
          size = p.stat().st_size
          print('status', d.get('status'), '| universe', d.get('universe'),
                '| scanned', d.get('scanned'), '| failed', d.get('failed'),
                '| recommended', d.get('recommended_count'),
                '| trade_date', d.get('trade_date'),
                '| fresh', d.get('fresh_count'),
                '| size', f'{size/1048576:.1f} MiB')
          if d.get('scanned', 0) < 50:
              raise SystemExit(f"只扫到 {d.get('scanned')} 只，数据不可信，不提交")
          if size > 18 * 1048576:
              raise SystemExit(f'产出 {size/1048576:.1f} MiB 超过 18MB（jsDelivr 上限 20MB）')
          ap = pathlib.Path('out/all_signals.json')
          if ap.exists():
              print('all_signals.json', f'{ap.stat().st_size/1024:.0f} KB')
          td = str(d.get('trade_date') or '')
          today = datetime.datetime.now().strftime('%Y-%m-%d')
          if td and td[:10] != today:
              print(f'::warning::trade_date={td} 与今天 {today} 不一致（非交易日可忽略）')
          PY

      - name: Dated copy
        run: |
          python - <<'PY'
          import json, pathlib, shutil, datetime
          p = pathlib.Path('out/daily_signals.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          ymd = (str(d.get('trade_date') or datetime.date.today().isoformat())).replace('-', '')
          for n in ('daily_signals', 'all_signals'):
              src = pathlib.Path(f'out/{n}.json')
              if src.exists():
                  shutil.copyfile(src, pathlib.Path(f'out/{n}_{ymd}.json'))
                  print('dated', n, ymd)
          keep = {(datetime.date.today() - datetime.timedelta(days=i)).strftime('%Y%m%d') for i in range(7)}
          for f in pathlib.Path('out').glob('*_20*.json'):
              ymd2 = f.stem.split('_')[-1]
              if ymd2 not in keep:
                  f.unlink()
                  print('cleanup', f.name)
          PY

      - name: Commit results
        run: |
          git config user.name "tiandao-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f out/daily_signals.json out/all_signals.json 'out/*_20*.json'
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "chore(signals): $(date -u +%F) scan"
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main

      - name: Purge jsDelivr cache
        run: |
          curl -fsS "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/out/daily_signals.json" || true
          curl -fsS "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/out/all_signals.json" || true
          echo "jsDelivr 缓存已请求清除"
