name: daily-scan

# 每个交易日 15:50（北京时间）自动扫全市场；也可手动触发
on:
  schedule:
    - cron: '50 7 * * 1-5'   # UTC 07:50 = 北京 15:50，收盘数据已定型，避开整点拥堵
  workflow_dispatch:
    inputs:
      limit:
        description: '扫描数量（测试填 50，全市场填 5000）'
        default: '5000'

concurrency:
  group: daily-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Scan market
        env:
          NO_PROXY: '*'
        run: |
          python scan_market.py --top "${{ github.event.inputs.limit || '5000' }}"

      - name: Show health
        run: |
          python - <<'PY'
          import json, pathlib, datetime
          p = pathlib.Path('out/daily_signals.json')
          if not p.exists():
              raise SystemExit('没有产出 daily_signals.json，扫描失败')
          d = json.loads(p.read_text(encoding='utf-8'))
          size = p.stat().st_size
          print('status', d.get('status'), '| universe', d.get('universe'),
                '| scanned', d.get('scanned'), '| failed', d.get('failed'),
                '| recommended', d.get('recommended_count'),
                '| trade_date', d.get('trade_date'),
                '| fresh', d.get('fresh_count'),
                '| size', f'{size/1048576:.1f} MiB')
          if d.get('status') == 'degraded':
              raise SystemExit('数据源大面积失败（degraded），本次不提交')
          if size > 18 * 1048576:
              raise SystemExit(f'产出 {size/1048576:.1f} MiB 超过 18MB（jsDelivr 单文件上限 20MB），拒绝提交')
          td = str(d.get('trade_date') or '')
          today = datetime.datetime.now().strftime('%Y-%m-%d')
          if td and td[:10] != today:
              print(f'::warning::trade_date={td} 与今天 {today} 不一致（节假日可忽略）')
          PY

      - name: Commit results
        run: |
          git config user.name "tiandao-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f out/daily_signals.json
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "chore(signals): $(date -u +%F) scan"
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main

      - name: Purge jsDelivr cache
        run: |
          curl -fsS "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/out/daily_signals.json" || true
          echo "jsDelivr 缓存已请求清除"

      - name: Keep artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signals-${{ github.run_id }}
          path: out/daily_signals.json
          retention-days: 3
          if-no-files-found: ignore
